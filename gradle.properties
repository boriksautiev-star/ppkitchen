# Параметры JVM для Gradle-демона
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Включить AndroidX (обязательно для современных библиотек)
android.useAndroidX=true

# Не генерировать R-классы для транзитивных зависимостей (ускоряет сборку)
android.nonTransitiveRClass=true

# Стиль кода Kotlin
kotlin.code.style=official

# Отключить проверку пути с кириллицей (на случай, если проект лежит в русской папке)
android.overridePathCheck=true